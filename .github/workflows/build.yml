name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between
# the run in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout the shell package (the chrome SSOT)
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/site-shell
          path: vendor/site-shell

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build    # astro build + pagefind --site dist

      - name: Stage PDFs and data into the build artifact
        run: |
          # Mirror pdfs/ and relaton-data-oiml/data/ into site/dist/ so
          # GitHub Pages can serve them. Bulletins and scratch dirs are
          # excluded (matches scripts/sync-pdfs.sh).
          rsync -a --exclude 'bulletin_*' --exclude '_caco3_downloads' --exclude '_oiml_org_downloads' \
            pdfs/ site/dist/pdfs/
          rsync -a \
            relaton-data-oiml/data/ site/dist/data/
          echo "Artifact contents:"
          du -sh site/dist/*

      - uses: actions/configure-pages@v4
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
